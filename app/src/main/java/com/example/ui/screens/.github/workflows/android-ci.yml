
name: FITMango Android CI

on:
  push:
    branches:
      - fitmango-latest
  pull_request:
    branches:
      - fitmango-latest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitmango-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FITMango-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
