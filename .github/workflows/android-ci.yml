name: FITMango Android CI

on:
  push:
    branches: [fresh-mango-ui-build125]
  pull_request:
    branches: [fresh-mango-ui-build125]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Kotlin compile and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed
      - name: Download offline exercise illustrations
        run: python3 scripts/fetch_repdb_assets.py
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Cache Robolectric native runtime
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/org.robolectric/nativeruntime-dist-compat/1.0.18
          key: robolectric-native-1.0.18-v1
      - name: Prefetch Robolectric native runtime
        run: |
          set -euo pipefail
          artifact=nativeruntime-dist-compat-1.0.18.jar
          path=org/robolectric/nativeruntime-dist-compat/1.0.18
          cache="$HOME/.gradle/caches/modules-2/files-2.1/$path"
          if find "$cache" -name "$artifact" -type f 2>/dev/null | grep -q .; then exit 0; fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for base in https://repo.maven.apache.org/maven2 https://repo1.maven.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
            if curl -fsSL --connect-timeout 20 --max-time 300 "$base/$path/$artifact" -o "$tmp/$artifact" && curl -fsSL --connect-timeout 20 --max-time 30 "$base/$path/$artifact.sha1" -o "$tmp/checksum"; then
              expected=$(awk '{print $1}' "$tmp/checksum")
              actual=$(sha1sum "$tmp/$artifact" | awk '{print $1}')
              if [ "$expected" = "$actual" ] && unzip -tq "$tmp/$artifact" >/dev/null; then
                mkdir -p "$cache/$actual"
                cp "$tmp/$artifact" "$cache/$actual/$artifact"
                exit 0
              fi
            fi
          done
          echo "::error::Robolectric runtime unavailable from Maven Central endpoints"
          exit 1
      - name: Verify Gradle wrapper
        run: chmod +x gradlew
      - name: Compile debug APK and run unit tests
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon --no-configuration-cache 2>&1 | tee "$RUNNER_TEMP/gradle-verify.log"; then
              exit 0
            fi
            if ! grep -Eq 'Plugin .* was not found|Could not resolve all (files|artifacts)|Could not (GET|HEAD)|Failed to fetch maven artifact' "$RUNNER_TEMP/gradle-verify.log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 90))
          done
          exit 1
      - name: Verify offline illustrations in APK
        run: |
          python3 - <<'PY'
          import glob, zipfile
          for apk in glob.glob("app/build/outputs/apk/**/*.apk", recursive=True):
              with zipfile.ZipFile(apk) as z:
                  count = sum(n.startswith("assets/repdb/") and n.endswith(".webp") for n in z.namelist())
                  assert count == 1231, (apk, count)
                  print(apk, count)
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FITMango-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fitmango-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  signed-release:
    name: Build signed release APK
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Download offline exercise illustrations
        run: python3 scripts/fetch_repdb_assets.py
      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitmango-signing.jks"
          test -s "$RUNNER_TEMP/fitmango-signing.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/fitmango-signing.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Verify offline illustrations in APK
        run: |
          python3 - <<'PY'
          import glob, zipfile
          for apk in glob.glob("app/build/outputs/apk/**/*.apk", recursive=True):
              with zipfile.ZipFile(apk) as z:
                  count = sum(n.startswith("assets/repdb/") and n.endswith(".webp") for n in z.namelist())
                  assert count == 1231, (apk, count)
                  print(apk, count)
          PY
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: FITMango-signed-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fitmango-signing.jks"
