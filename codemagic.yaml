

workflows:
  android-build:
    name: FITMango 1.3.0 Build 117
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Przygotowanie Gradle
        script: |
          chmod +x gradlew

      - name: Budowanie APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
