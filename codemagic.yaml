
workflows:
  android-build:
    name: FITMango Premium - signed release APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21
      groups:
        - fitmango_key_setup

    scripts:
      - name: Potwierdzenie wersji i źródeł
        script: |
          echo "FITMango branch: $CM_BRANCH"
          echo "FITMango commit: $(git rev-parse HEAD)"
          echo "FITMango version from app/build.gradle.kts:"
          grep -E 'versionCode|versionName' app/build.gradle.kts
          test "$CM_BRANCH" = "fresh-mango-ui-build125" || { echo 'BŁĄD: wybrano niewłaściwą gałąź'; exit 1; }
          grep -q 'fun DashboardScreen(' app/src/main/java/com/example/ui/screens/DashboardScreen.kt || { echo 'BŁĄD: brakuje ekranu pulpitu'; exit 1; }
          grep -q 'fresh_mango_quick_add' app/src/main/java/com/example/ui/screens/MealPlanScreen.kt || { echo 'BŁĄD: brakuje interfejsu Fresh Mango'; exit 1; }

      - name: Przygotowanie Gradle
        script: |
          chmod +x gradlew

      - name: Odtworzenie klucza z zaszyfrowanej kopii
        script: |
          set -eu
          : "${FITMANGO_ENCRYPTED_KEYSTORE_BASE64:?Brak zaszyfrowanej kopii klucza w chronionej zmiennej FITMANGO_ENCRYPTED_KEYSTORE_BASE64}"
          : "${KEY_BACKUP_PASSWORD:?Brak KEY_BACKUP_PASSWORD}"
          : "${STORE_PASSWORD:?Brak STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Brak KEY_PASSWORD}"
          KEYSTORE_PATH="$PWD/my-upload-key.jks"
          ENCRYPTED_PATH="$CM_BUILD_DIR/fitmango-signing-key.jks.enc"
          umask 077
          printf '%s' "$FITMANGO_ENCRYPTED_KEYSTORE_BASE64" | base64 -D > "$ENCRYPTED_PATH"
          test -s "$ENCRYPTED_PATH" || { echo "BŁĄD: zaszyfrowany plik jest pusty"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ENCRYPTED_PATH" -out "$KEYSTORE_PATH" -pass env:KEY_BACKUP_PASSWORD || {
              rm -f "$KEYSTORE_PATH"
              echo "BŁĄD: nie udało się odszyfrować klucza. Sprawdź hasło kopii i plik."
              exit 1
            }
          rm -f "$ENCRYPTED_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias upload >/dev/null || {
            rm -f "$KEYSTORE_PATH"
            echo "BŁĄD: klucz nie pasuje do STORE_PASSWORD lub aliasu upload."
            exit 1
          }
          echo "Zweryfikowano stały klucz podpisujący; nie generujemy nowego."

      - name: Budowanie podpisanego APK release
        script: |
          set -eu
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk "build-artifacts/FITMango-Premium-build125-$(git rev-parse --short HEAD).apk"
          # Reject an unsigned/wrongly packaged artifact before publishing it.
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "BŁĄD: brak release APK"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "BŁĄD: brak apksigner"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          if [ -n "${EXPECTED_SIGNING_CERT_SHA256:-}" ]; then
            ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')
            EXPECTED_CERT=$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')
            test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "BŁĄD: certyfikat APK nie pasuje do poprzedniej instalacji"; exit 1; }
          fi
          echo "Sprawdzono podpis APK release. Do aktualizacji NIE używaj app-debug.apk."
          echo "APK przygotowane z commita $(git rev-parse HEAD)"

    artifacts:
      - build-artifacts/FITMango-Premium-*.apk
