
workflows:
  android-build:
    name: FITMango Premium - verified source
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Potwierdzenie wersji i źródeł
        script: |
          echo "FITMango branch: $CM_BRANCH"
          echo "FITMango commit: $(git rev-parse HEAD)"
          echo "FITMango version from app/build.gradle.kts:"
          grep -E 'versionCode|versionName' app/build.gradle.kts
          test "$CM_BRANCH" = "fitmango-modern-fresh-redesign" || { echo 'BŁĄD: ten workflow jest przeznaczony dla gałęzi Modern Fresh'; exit 1; }
          grep -q 'fun DashboardScreen(' app/src/main/java/com/example/ui/screens/DashboardScreen.kt || { echo 'BŁĄD: brakuje ekranu pulpitu'; exit 1; }
          grep -q 'fresh_mango_quick_add' app/src/main/java/com/example/ui/screens/MealPlanScreen.kt || { echo 'BŁĄD: brakuje interfejsu Fresh Mango'; exit 1; }

      - name: Przygotowanie Gradle
        script: |
          chmod +x gradlew

      - name: Przygotowanie stałego klucza podpisującego
        script: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Brak ANDROID_KEYSTORE_BASE64 w chronionych zmiennych Codemagic}"
          : "${STORE_PASSWORD:?Brak STORE_PASSWORD w chronionych zmiennych Codemagic}"
          : "${KEY_PASSWORD:?Brak KEY_PASSWORD w chronionych zmiennych Codemagic}"
          : "${KEY_ALIAS:?Brak KEY_ALIAS w chronionych zmiennych Codemagic}"
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -D > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "BŁĄD: pusty plik klucza"; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || {
            echo "BŁĄD: nieprawidłowy plik, alias lub hasło klucza"; exit 1;
          }
          echo "Stały klucz podpisujący jest dostępny; nie generujemy nowego."

      - name: Budowanie podpisanego APK
        script: |
          set -eu
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk "build-artifacts/FITMango-Modern-Fresh-$(git rev-parse --short HEAD).apk"
          echo "Podpisany APK przygotowany z commita $(git rev-parse HEAD)"

    artifacts:
      - build-artifacts/FITMango-Modern-Fresh-*.apk

  generate-signing-key:
    name: FITMango - jednorazowe utworzenie klucza (szyfrowana kopia)
    instance_type: mac_mini_m2
    max_build_duration: 15

    environment:
      java: 21
      groups:
        - fitmango_key_setup

    scripts:
      - name: Diagnostyka dostępu do zmiennych (bez ujawniania haseł)
        script: |
          set -eu
          echo "Gałąź: $CM_BRANCH"
          echo "Weryfikacja obecności zmiennych w grupie fitmango_key_setup:"
          missing=0
          for name in STORE_PASSWORD KEY_PASSWORD KEY_BACKUP_PASSWORD; do
            case "$name" in
              STORE_PASSWORD) value="${STORE_PASSWORD:-}" ;;
              KEY_PASSWORD) value="${KEY_PASSWORD:-}" ;;
              KEY_BACKUP_PASSWORD) value="${KEY_BACKUP_PASSWORD:-}" ;;
            esac
            if [ -n "$value" ]; then
              echo "$name: dostępna i niepusta"
            else
              echo "$name: BRAK lub pusta"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "BŁĄD: co najmniej jedna zmienna nie jest dostępna lub jest pusta. Sprawdź grupę i ustawienia sekretów."
            exit 1
          fi

      - name: Utworzenie i zaszyfrowanie klucza
        script: |
          set -eu
          test "$CM_BRANCH" = "fitmango-modern-fresh-redesign" || { echo "Nieprawidłowa gałąź"; exit 1; }
          : "${STORE_PASSWORD:?Ustaw chronioną zmienną STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Ustaw chronioną zmienną KEY_PASSWORD}"
          : "${KEY_BACKUP_PASSWORD:?Ustaw chronioną zmienną KEY_BACKUP_PASSWORD}"
          test "${#STORE_PASSWORD}" -ge 12 || { echo "STORE_PASSWORD musi mieć co najmniej 12 znaków"; exit 1; }
          test "${#KEY_PASSWORD}" -ge 12 || { echo "KEY_PASSWORD musi mieć co najmniej 12 znaków"; exit 1; }
          test "${#KEY_BACKUP_PASSWORD}" -ge 16 || { echo "KEY_BACKUP_PASSWORD musi mieć co najmniej 16 znaków"; exit 1; }
          mkdir -p build-artifacts
          umask 077
          keytool -genkeypair -noprompt \
            -keystore fitmango-release.jks \
            -alias upload \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -dname "CN=FITMango,OU=Android,O=FITMango,C=GB"
          keytool -list -keystore fitmango-release.jks -storepass:env STORE_PASSWORD -alias upload >/dev/null
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in fitmango-release.jks \
            -out build-artifacts/FITMango-signing-key.jks.enc \
            -pass env:KEY_BACKUP_PASSWORD
          rm -f fitmango-release.jks
          echo "Zapisano WYŁĄCZNIE zaszyfrowany plik .enc. Zachowaj hasła i kopię pliku poza Codemagic."
          echo "To jest jednorazowy workflow. Nie uruchamiaj ponownie po rozpoczęciu używania tego klucza."

    artifacts:
      - build-artifacts/FITMango-signing-key.jks.enc
