
workflows:
  android-build:
    name: FITMango 1.3.0 Build 117
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Przygotowanie Gradle
        script: |
          chmod +x gradlew

      - name: Przygotowanie debug.keystore
        script: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Budowanie APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
