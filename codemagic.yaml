workflows:
  android-build:
    name: FITMango Fresh Mango Build 126
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Przygotowanie Gradle
        script: chmod +x gradlew

      - name: Przywrocenie stalego klucza podpisujacego
        script: |
          set -eu
          : "${FITMANGO_KEYSTORE_BASE64:?Ustaw tajny FITMANGO_KEYSTORE_BASE64 w Codemagic}"
          : "${FITMANGO_STORE_PASSWORD:?Ustaw tajny FITMANGO_STORE_PASSWORD w Codemagic}"
          : "${FITMANGO_KEY_ALIAS:?Ustaw FITMANGO_KEY_ALIAS w Codemagic}"
          : "${FITMANGO_KEY_PASSWORD:?Ustaw tajny FITMANGO_KEY_PASSWORD w Codemagic}"
          printf '%s' "$FITMANGO_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass "$FITMANGO_STORE_PASSWORD" -alias "$FITMANGO_KEY_ALIAS" > /dev/null
          echo "Staly klucz podpisujacy jest gotowy."

      - name: Budowanie APK aktualizacyjnego
        script: ./gradlew :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
