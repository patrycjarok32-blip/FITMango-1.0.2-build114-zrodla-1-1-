
workflows:
  android-build:
    name: FITMango Premium - verified source
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21

    scripts:
      - name: Potwierdzenie wersji i źródeł
        script: |
          echo "FITMango branch: $CM_BRANCH"
          echo "FITMango commit: $(git rev-parse HEAD)"
          echo "FITMango version from app/build.gradle.kts:"
          grep -E 'versionCode|versionName' app/build.gradle.kts
          test "$CM_BRANCH" = "fitmango-modern-fresh-redesign" || { echo 'BŁĄD: ten workflow jest przeznaczony dla gałęzi Modern Fresh'; exit 1; }
          grep -q 'fun DashboardScreen(' app/src/main/java/com/example/ui/screens/DashboardScreen.kt || { echo 'BŁĄD: brakuje ekranu pulpitu'; exit 1; }
          grep -q 'fresh_mango_quick_add' app/src/main/java/com/example/ui/screens/MealPlanScreen.kt || { echo 'BŁĄD: brakuje interfejsu Fresh Mango'; exit 1; }

      - name: Przygotowanie Gradle
        script: |
          chmod +x gradlew

      - name: Przygotowanie stałego klucza podpisującego
        script: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Brak ANDROID_KEYSTORE_BASE64 w chronionych zmiennych Codemagic}"
          : "${STORE_PASSWORD:?Brak STORE_PASSWORD w chronionych zmiennych Codemagic}"
          : "${KEY_PASSWORD:?Brak KEY_PASSWORD w chronionych zmiennych Codemagic}"
          : "${KEY_ALIAS:?Brak KEY_ALIAS w chronionych zmiennych Codemagic}"
          mkdir -p "$CM_BUILD_DIR/.signing"
          export KEYSTORE_PATH="$CM_BUILD_DIR/.signing/fitmango-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "BŁĄD: pusty plik klucza"; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || {
            echo "BŁĄD: nieprawidłowy plik, alias lub hasło klucza"; exit 1;
          }
          echo "Stały klucz podpisujący jest dostępny; nie generujemy nowego."

      - name: Budowanie podpisanego APK
        script: |
          set -eu
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk "build-artifacts/FITMango-Modern-Fresh-$(git rev-parse --short HEAD).apk"
          echo "Podpisany APK przygotowany z commita $(git rev-parse HEAD)"

    artifacts:
      - build-artifacts/FITMango-Modern-Fresh-*.apk
