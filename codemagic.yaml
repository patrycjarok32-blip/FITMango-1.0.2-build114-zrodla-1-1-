
workflows:
  fitmango-1-2-0-build116:
    name: FITMango 1.2.0 - Build 116
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 21

    scripts:
      - name: Prepare Android project
        script: |
          set -e
          java -version
          chmod +x gradlew

          echo "Checking Android SDK..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Checking FITMango version..."
          grep -nE 'versionCode|versionName' app/build.gradle.kts || true

          echo "Project preparation completed."

      - name: Create debug keystore
        script: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          echo "Debug keystore is ready."

      - name: Build FITMango APK
        script: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        script: |
          set -e

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$APK_PATH" ]; then
            echo "FITMango APK created successfully."
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK not found."
            exit 1
          fi

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/*.txt
