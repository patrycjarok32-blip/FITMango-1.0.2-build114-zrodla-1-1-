
workflows:
  android-build:
    name: FITMango Premium - verified source
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 21
      groups:
        - fitmango_key_setup

    scripts:
      - name: Potwierdzenie wersji i źródeł
        script: |
          echo "FITMango branch: $CM_BRANCH"
          echo "FITMango commit: $(git rev-parse HEAD)"
          echo "FITMango version from app/build.gradle.kts:"
          grep -E 'versionCode|versionName' app/build.gradle.kts
          test "$CM_BRANCH" = "fresh-mango-ui-build125" || { echo 'BŁĄD: wybrano niewłaściwą gałąź'; exit 1; }
          grep -q 'fun DashboardScreen(' app/src/main/java/com/example/ui/screens/DashboardScreen.kt || { echo 'BŁĄD: brakuje ekranu pulpitu'; exit 1; }
          grep -q 'fresh_mango_quick_add' app/src/main/java/com/example/ui/screens/MealPlanScreen.kt || { echo 'BŁĄD: brakuje interfejsu Fresh Mango'; exit 1; }

      - name: Przygotowanie Gradle
        script: |
          chmod +x gradlew

      - name: Odtworzenie stałego klucza podpisującego
        script: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Brak ANDROID_KEYSTORE_BASE64 w grupie fitmango_key_setup}"
          : "${STORE_PASSWORD:?Brak STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Brak KEY_PASSWORD}"
          : "${KEY_ALIAS:?Brak KEY_ALIAS}"
          KEYSTORE_PATH="$PWD/my-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -D > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "BŁĄD: pusty klucz podpisujący"; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null || {
            echo "BŁĄD: nieprawidłowy klucz, alias lub hasło"; exit 1;
          }
          echo "Stały klucz podpisujący został zweryfikowany."

      - name: Budowanie podpisanego APK release
        script: |
          set -eu
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p build-artifacts
          cp app/build/outputs/apk/release/app-release.apk "build-artifacts/FITMango-Premium-build125-$(git rev-parse --short HEAD).apk"
          echo "APK przygotowane z commita $(git rev-parse HEAD)"

    artifacts:
      - build-artifacts/FITMango-Premium-*.apk
